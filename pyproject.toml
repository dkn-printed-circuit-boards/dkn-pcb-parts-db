[project]
name = "dkn-pcb-parts-db"
version = "0.1.0"
description = "CAD-neutral knowledge base for PCB parts: facts with citations, trust levels, conflicts, and gaps"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
parts-db = "dkn_pcb_parts_db.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dkn_pcb_parts_db"]
